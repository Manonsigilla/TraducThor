<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-engine translator</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="app">

    <!-- HEADER -->
    <header class="app-header">
      <div class="logo-dot"></div>
      <h1>Multi-engine <span>translator</span></h1>

      <!-- THOR SCORE -->
      <div class="thor-score" id="thor-score" title="Thor's lightning — earned per translation">
        <span class="bolt-icon">⚡</span>
        <span class="bolt-count" id="bolt-count">0</span>
      </div>
    </header>

    <!-- HUMOROUS SCORE PHRASE -->
    <p class="thor-quip" id="thor-quip"></p>

    <!-- WORKSPACE: input | results -->
    <div class="workspace">

      <!-- INPUT PANEL -->
      <div class="panel">
        <div class="lang-row">
          <select id="source" aria-label="Source language">
            <option value="auto">Auto-detect</option>
            <option value="fr">French</option>
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="de">German</option>
            <option value="it">Italian</option>
            <option value="pt">Portuguese</option>
            <option value="nl">Dutch</option>
            <option value="ar">Arabic</option>
            <option value="zh">Chinese</option>
            <option value="ja">Japanese</option>
            <option value="ru">Russian</option>
          </select>
          <span class="arrow">→</span>
          <select id="target" aria-label="Target language">
            <option value="en">English</option>
            <option value="fr">French</option>
            <option value="es">Spanish</option>
            <option value="de">German</option>
            <option value="it">Italian</option>
            <option value="pt">Portuguese</option>
            <option value="nl">Dutch</option>
            <option value="ar">Arabic</option>
            <option value="zh">Chinese</option>
            <option value="ja">Japanese</option>
            <option value="ru">Russian</option>
          </select>
        </div>

        <div class="textarea-wrap">
          <textarea
            id="input"
            placeholder="Enter your text… (Ctrl+Enter to translate)"
            spellcheck="false"
            maxlength="5000"
          ></textarea>
          <span class="char-count" id="char-count">0 characters</span>
        </div>

        <button class="btn-translate" id="btn-translate">
          <span class="btn-text">Translate</span>
          <span class="btn-spinner"></span>
        </button>
      </div>

      <!-- RESULTS PANEL -->
      <div class="results-panel">
        <span class="results-label">Results</span>
        <div class="results-grid" id="results-grid"></div>
      </div>

    </div>
  </div>

  <script src="/static/js/main.js"></script>
</body>
</html>
